    <!-- Branded loading screen: covers the plain search-engine copy of the page until the shop starts -->
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 2147483000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: #13344f; transition: opacity 0.25s ease;
      }
      #boot img { width: 180px; height: auto; }
      #boot span {
        width: 30px; height: 30px; border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.2); border-top-color: #2ba8e0;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <noscript><style>#boot { display: none; }</style></noscript>
    <link rel="preload" as="image" href="/brand/bagz-logo-white.png" />
  </head>
  <body>
    <div id="boot" aria-hidden="true"><img src="/brand/bagz-logo-white.png" alt="" width="180" height="43" /><span></span></div>
    <script>
      // Safety net: if the shop cannot start (very old browser, blocked script), show the page text.
      // Only after everything has downloaded (slow networks can take well over 15 s) plus a grace period.
      (function () {
        function reveal() {
          // The shop did not start (an old saved copy of this page pointing to replaced files, or a
          // download cut off on a slow network): reload once for fresh files before giving up.
          var app = document.getElementById("app");
          var notStarted = app && app.querySelector(".seo-prerender");
          var key = "bagz-boot-retry";
          var retried = false;
          try {
            retried = sessionStorage.getItem(key) === "1";
            if (notStarted && !retried) {
              sessionStorage.setItem(key, "1");
              location.reload();
              return;
            }
            if (!notStarted) sessionStorage.removeItem(key);
          } catch (e) {}
          var b = document.getElementById("boot");
          if (b) b.remove();
        }
        // Only once everything has downloaded: on a slow network the shop's program can take more
        // than a minute, and reloading earlier would restart that download.
        window.addEventListener("load", function () {
          setTimeout(reveal, 5000);
        });
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
